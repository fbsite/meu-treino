<!DOCTYPE html>
<html lang="pt-BR">
<head>

<!-- Favicon .ico -->
  <link rel="icon" type="image/x-icon" href="https://i.supaimg.com/e7c4bf0e-aa4f-48ab-946d-edfa535b391a.png">
  <link rel="shortcut icon" href=https://i.supaimg.com/e7c4bf0e-aa4f-48ab-946d-edfa535b391a.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Performance - Fábio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .bg-gray-800 { background-color: #1e293b; }
        .text-cyan-400 { color: #22d3ee; }
        .hidden { display: none !important; }
        .modal { display: none; }
        .modal.show { display: flex; }
        .dropdown-content { display: none; }
        .dropdown-content.show { display: block; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .active-tab { background-color: #0891b2 !important; color: white !important; }
        .day-btn.active { background-color: #0891b2 !important; border-color: #22d3ee !important; color: white !important; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        /* Correção para inputs em telas pequenas */
        .input-group { min-width: 0; flex: 1; }
    </style>
</head>
<body class="p-4 pb-24 safe-bottom">

    <div class="max-w-xl mx-auto">
        <!-- Cabeçalho -->
        <header class="text-center mb-6">
            <div class="flex items-center justify-center gap-2 mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-cyan-400"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m6 2 4 4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/><path d="M12 12m-3 0a3 3 0 1 1 6 0 3 3 0 1 1-6 0"/></svg>
                <h1 class="text-xl font-bold uppercase tracking-tight">Plano Performance</h1>
            </div>
            <h2 class="text-lg font-semibold text-white">Fábio</h2>
            <p id="motivational-quote" class="text-gray-400 italic text-[11px] mt-3 px-4 leading-relaxed"></p>
        </header>

        <!-- Datas -->
        <div class="bg-gray-800 p-4 rounded-2xl border border-white/5 mb-6 shadow-xl">
            <div class="flex justify-between items-center text-center">
                <div>
                    <p class="text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-1">Início</p>
                    <p class="text-sm font-bold">02/03/2026</p>
                </div>
                <div class="h-6 w-px bg-gray-700"></div>
                <div>
                    <p class="text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-1">Meta 10% BF</p>
                    <p class="text-sm font-bold text-cyan-400">02/05/2026</p>
                </div>
            </div>
        </div>

        <!-- Navegação -->
        <nav class="flex bg-gray-800 rounded-2xl p-1 mb-6 border border-white/5 shadow-inner">
            <button onclick="switchTab('treino')" id="tab-btn-treino" class="nav-btn flex-1 py-3 rounded-xl text-xs font-bold transition-all active-tab">TREINO</button>
            <button onclick="switchTab('dieta')" id="tab-btn-dieta" class="nav-btn flex-1 py-3 rounded-xl text-xs font-bold transition-all text-gray-400">DIETA</button>
            <button onclick="switchTab('progresso')" id="tab-btn-progresso" class="nav-btn flex-1 py-3 rounded-xl text-xs font-bold transition-all text-gray-400">PROGRESSO</button>
        </nav>

        <main id="main-content">
            <!-- ABA TREINO -->
            <section id="view-treino" class="view-content">
                <div class="relative mb-4">
                    <button onclick="toggleWorkoutDropdown()" class="w-full bg-gray-800 border border-white/5 rounded-2xl px-5 py-4 text-left flex justify-between items-center shadow-lg">
                        <span id="display-workout-name" class="font-bold text-sm text-cyan-400">Selecionar Treino...</span>
                        <svg id="dropdown-icon" class="transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div id="workout-dropdown" class="dropdown-content absolute top-full left-0 right-0 bg-gray-800 border border-white/10 mt-2 rounded-2xl z-50 shadow-2xl overflow-hidden"></div>
                </div>

                <div class="bg-gray-800 p-4 rounded-2xl border border-white/5 mb-6">
                    <div class="grid grid-cols-6 gap-2" id="day-selector"></div>
                </div>

                <div id="exercise-list" class="space-y-4"></div>
            </section>

            <!-- ABA DIETA -->
            <section id="view-dieta" class="view-content hidden">
                <div class="flex bg-gray-900/50 p-1 rounded-xl mb-6 border border-white/5">
                    <button onclick="switchDietMode('treino')" id="diet-mode-treino" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all bg-cyan-600 text-white">DIA DE TREINO</button>
                    <button onclick="switchDietMode('descanso')" id="diet-mode-descanso" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all text-gray-500">DIA DE DESCANSO</button>
                </div>
                <div id="diet-container" class="space-y-4"></div>
            </section>

            <!-- ABA PROGRESSO -->
            <section id="view-progresso" class="view-content hidden">
                <div class="bg-gray-800 p-5 rounded-2xl border border-white/5 shadow-lg mb-6">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/5">
                         <div class="flex flex-col">
                            <span class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Idade Corporal</span>
                            <span class="text-sm font-bold">34 Anos</span>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Altura</span>
                            <span class="text-sm font-bold">1.70m</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-gray-900/50 p-4 rounded-2xl border border-white/5 text-center">
                            <p class="text-[9px] text-gray-500 uppercase mb-1 font-bold">Peso Atual</p>
                            <p id="current-weight-card" class="text-xl font-bold text-white">70.6kg</p>
                        </div>
                        <div class="bg-gray-900/50 p-4 rounded-2xl border border-white/5 text-center">
                            <p class="text-[9px] text-gray-500 uppercase mb-1 font-bold">Gordura Atual</p>
                            <p id="current-fat-card" class="text-xl font-bold text-cyan-400">15.3%</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-gray-900/50 p-2 rounded-xl border border-white/5 text-center">
                            <p class="text-[8px] text-gray-500 uppercase">Músculo</p>
                            <p class="text-xs font-bold text-white">42%</p>
                        </div>
                        <div class="bg-gray-900/50 p-2 rounded-xl border border-white/5 text-center">
                            <p class="text-[8px] text-gray-500 uppercase">Visceral</p>
                            <p class="text-xs font-bold text-white">7</p>
                        </div>
                        <div class="bg-gray-900/50 p-2 rounded-xl border border-white/5 text-center">
                            <p class="text-[8px] text-gray-500 uppercase">Basal</p>
                            <p class="text-xs font-bold text-white">1649<span class="text-[8px]">kcal</span></p>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 p-5 rounded-2xl border border-white/5 shadow-lg mb-6">
                    <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase text-center tracking-widest">Novo Registro</h3>
                    <div class="flex flex-col gap-4">
                        <div class="flex gap-3">
                            <div class="input-group">
                                <label class="block text-[8px] text-gray-500 uppercase font-bold mb-1 text-center">Peso (kg)</label>
                                <input id="input-weight" type="number" step="0.1" placeholder="0.0" class="w-full bg-gray-900 border border-white/10 p-3 rounded-xl text-center font-bold text-white outline-none focus:border-cyan-400">
                            </div>
                            <div class="input-group">
                                <label class="block text-[8px] text-gray-500 uppercase font-bold mb-1 text-center">BF (%)</label>
                                <input id="input-fat" type="number" step="0.1" placeholder="0.0" class="w-full bg-gray-900 border border-white/10 p-3 rounded-xl text-center font-bold text-cyan-400 outline-none focus:border-cyan-400">
                            </div>
                        </div>
                        <button onclick="addProgressEntry()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-[10px] uppercase tracking-widest active:scale-95 shadow-lg">Salvar Dados</button>
                    </div>
                </div>

                <div class="bg-gray-800 p-5 rounded-2xl border border-white/5 shadow-lg">
                    <h3 class="text-xs font-bold text-cyan-400 mb-4 uppercase tracking-widest text-center">Medidas Fixas (Referência)</h3>
                    <div id="perimeters-list" class="grid grid-cols-2 gap-x-4 gap-y-2"></div>
                </div>
            </section>
        </main>

        <!-- Modais -->
        <div id="timer-modal" class="modal fixed inset-0 bg-black/90 items-center justify-center z-[100]">
            <div class="bg-gray-800 rounded-[40px] p-10 text-center border border-cyan-500/20 shadow-2xl">
                <h3 class="text-cyan-400 uppercase text-xs tracking-[0.3em] mb-4 font-bold">Descanso</h3>
                <p id="timer-clock" class="text-7xl font-mono font-bold text-white mb-8 tracking-tighter">0:00</p>
                <button onclick="skipTimer()" class="bg-white/5 text-white border border-white/10 px-12 py-2 rounded-full font-bold text-xs uppercase tracking-widest">Pular</button>
            </div>
        </div>

        <div id="img-modal" class="modal fixed inset-0 bg-black items-center justify-center z-[110] p-4" onclick="this.classList.remove('show')">
            <img id="img-modal-src" src="" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl border border-white/5">
        </div>

        <footer class="text-center mt-12 text-gray-600">
            <p class="text-[9px] uppercase tracking-[0.4em]">Fábio Performance • v8.3 GitHub Ready</p>
        </footer>
    </div>

    <script>
        // --- DATA ---
        const quotes = [
            "Fábio, visualiza os 10% de BF todos os dias.",
            "Consistência vence o talento. Todo santo dia.",
            "O músculo 42% é a tua armadura. Mantém a carga!",
            "Disciplina é a ponte entre metas e realizações.",
            "Peito largo e braços fortes: foco total no 5x5.",
            "Não negocie com a sua mente. Apenas faça.",
            "Cumpra o plano. A glória é inevitável."
        ];

        const workoutData = [
            { id: 'a', day: 'Seg', name: 'A: Peito & Deltoide Frontal (Força)', exercises: [
                { n: 'Supino Reto Barra', s: 5, r: '5', d: 150, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Bench-Press.gif', t: 'Foco total em carga - Explosão' },
                { n: 'Supino Inclinado Halteres', s: 4, r: '8-10', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Incline-Bench-Press.gif', t: 'Controlo excêntrico 3s' },
                { n: 'Desenvolvimento Militar Barra', s: 4, r: '6-8', d: 120, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Overhead-Press.gif' },
                { n: 'Crucifixo Máquina / Polia', s: 3, r: '12-15', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Pec-Deck-Fly.gif', t: 'Isometria 2s no pico' }
            ]},
            { id: 'b', day: 'Ter', name: 'B: Costas & Posterior (Força)', exercises: [
                { n: 'Levantamento Terra', s: 5, r: '5', d: 180, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Deadlift.gif', t: 'Escápulas travadas' },
                { n: 'Remada Curvada Barra', s: 4, r: '8', d: 120, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Bent-Over-Row.gif', t: 'Tronco paralelo ao chão' },
                { n: 'Barra Fixa', s: 4, r: 'Falha', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Pull-up.gif', t: 'Carga extra' },
                { n: 'Crucifixo Invertido Halteres', s: 4, r: '15', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Rear-Lateral-Raise.gif' }
            ]},
            { id: 'c', day: 'Qua', name: 'C: Inferiores (Quadríceps Focus)', exercises: [
                { n: 'Agachamento Livre', s: 4, r: '8', d: 150, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Squat.gif' },
                { n: 'Leg Press 45', s: 4, r: '12', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/03/Leg-Press.gif' },
                { n: 'Cadeira Extensora', s: 4, r: '15 + DropSet', d: 60, g: 'https://www.mundoboaforma.com.br/wp-content/uploads/2020/12/cadeira-extensora.gif', t: 'Drop-set na última' },
                { n: 'Panturrilha em Pé', s: 5, r: '20', d: 45, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Standing-Calf-Raise.gif' }
            ]},
            { id: 'd', day: 'Qui', name: 'D: Braços Completo (Hipertrofia)', exercises: [
                { n: 'Supino Fechado (Tríceps)', s: 4, r: '8', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Close-Grip-Bench-Press.gif' },
                { n: 'Rosca Direta Barra W', s: 4, r: '8-10', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/EZ-Bar-Curl.gif' },
                { n: 'Tríceps Testa Polia', s: 3, r: '12', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Cable-Triceps-Extension.gif' },
                { n: 'Rosca Martelo Halteres', s: 3, r: '12', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/04/Hammer-Curl.gif' },
                { n: 'Rosca Inversa Barra', s: 3, r: '15', d: 45, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Reverse-Curl.gif' }
            ]},
            { id: 'e', day: 'Sex', name: 'E: Peito & Costas (Volume & Pump)', exercises: [
                { n: 'Supino Inclinado Barra', s: 4, r: '12', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Incline-Barbell-Bench-Press.gif' },
                { n: 'Puxada Triângulo', s: 4, r: '12', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/04/puxada-frente-fechada-pulley-triangulo.gif' },
                { n: 'Paralelas (Peito Focus)', s: 3, r: 'Falha', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Dip.gif', t: 'Tronco inclinado' },
                { n: 'Remada Sentada Neutra', s: 3, r: '15', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Seated-Cable-Row.gif', t: 'Isometria 2s' }
            ]},
            { id: 'f', day: 'Sáb', name: 'F: Ombros, Core & Pump Braços', exercises: [
                { n: 'Desenvolvimento Arnold', s: 4, r: '10-12', d: 90, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Arnold-Press.gif' },
                { n: 'Elevação Lateral Halteres', s: 5, r: '15-20', d: 45, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Lateral-Raise.gif', t: 'Rest-Pause na última' },
                { n: 'Abdominal Roda', s: 4, r: 'Falha', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Ab-Roller.gif' },
                { n: 'Prancha Isométrica', s: 3, r: '1 min', d: 60, g: 'https://fitnessprogramer.com/wp-content/uploads/2021/02/Plank.gif' }
            ]}
        ];

        const nutritionData = {
            treino: { kcal: 2400, p: 155, c: 300, g: 65, meals: [
                { t: "07:00", n: "Ao Acordar & Suple.", i: "Café + 150g Leite desnatado. (Multi + 3g Ômega 3)", m: "30P|40C|12G" },
                { t: "07:30", n: "Refeição 1 (Pré-T)", i: "Vitamina (Banana, Maçã, Whey, Leite) OU Mingau de Aveia.", m: "25P|50C|5G" },
                { t: "12:00", n: "Refeição 3 (Almoço)", i: "180g Frango + 100g Arroz + 150g Feijão. Sobremesa: Fruta.", m: "45P|60C|10G" },
                { t: "19:00", n: "Refeição 5 (Jantar)", i: "200g Carne moída + 200g Brócolis/Couve-flor.", m: "40P|10C|15G" },
                { t: "21:30", n: "Refeição 6 (Ceia)", i: "220g Ovos mexidos (4 un) OU Iogurte Grego + Granola.", m: "30P|15C|15G" }
            ]},
            descanso: { kcal: 2000, p: 155, c: 180, g: 75, meals: [
                { t: "07:00", n: "Pequeno-almoço", i: "Café 150g leite + 220g Ovos + 50g Pão integral.", m: "35P|30C|15G" },
                { t: "11:00", n: "Almoço", i: "200g Carne moída + Salada verde livre.", m: "40P|5C|15G" },
                { t: "18:00", n: "Jantar", i: "200g Frango grelhado + 100g Abacate.", m: "45P|5C|30G" },
                { t: "21:00", n: "Ceia", i: "170g Iogurte Grego Natural.", m: "20P|10C|5G" }
            ]}
        };

        const initialMeasures = { "Braço E": 35.0, "Braço D": 37.0, "Tórax": 93.0, "Abdome": 82.0, "Cintura": 84.0, "Coxa E": 59.0, "Coxa D": 60.0, "Pant. E": 38.0, "Pant. D": 38.0, "Ombro": 121.0 };

        // --- STATE & COOKIES ---
        const COOKIE_KEY = 'fabio_gh_v8_3';
        let state = {
            tab: 'treino',
            dietMode: 'treino',
            workoutId: 'a',
            history: [{ d: '25/02', w: 70.6, f: 15.3 }],
            logs: {},
            measures: { ...initialMeasures }
        };

        let timerInterval = null;

        // --- CORE FUNCTIONS ---
        window.onload = function() { load(); initUI(); switchTab(state.tab); };

        function save() {
            const date = new Date(); date.setFullYear(date.getFullYear() + 1);
            document.cookie = `${COOKIE_KEY}=${encodeURIComponent(JSON.stringify(state))}; expires=${date.toUTCString()}; path=/; SameSite=Lax`;
        }

        function load() {
            const match = document.cookie.match(new RegExp('(^| )' + COOKIE_KEY + '=([^;]+)'));
            if (match) { try { state = { ...state, ...JSON.parse(decodeURIComponent(match[2])) }; } catch(e) { console.error("Erro cookies"); } }
        }

        function initUI() {
            const today = new Date().getDate();
            document.getElementById('motivational-quote').textContent = `"${quotes[today % quotes.length]}"`;
            
            document.getElementById('workout-dropdown').innerHTML = workoutData.map(w => `
                <div onclick="selectWorkout('${w.id}')" class="p-4 border-b border-white/5 text-sm hover:bg-white/5 cursor-pointer">${w.name}</div>
            `).join('');

            document.getElementById('day-selector').innerHTML = workoutData.map(w => `
                <div onclick="selectWorkout('${w.id}')" id="day-${w.id}" class="day-btn p-3 rounded-xl text-center cursor-pointer transition-all bg-gray-900 text-gray-500">
                    <p class="text-[10px] font-bold uppercase">${w.day}</p>
                </div>
            `).join('');

            document.getElementById('perimeters-list').innerHTML = Object.entries(state.measures).map(([k, v]) => `
                <div class="flex justify-between items-center py-2 border-b border-white/5">
                    <span class="text-[9px] text-gray-400 uppercase tracking-tighter">${k}</span>
                    <span class="text-xs font-bold text-white">${v}cm</span>
                </div>
            `).join('');
        }

        function switchTab(t) {
            state.tab = t;
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-white'));
            document.getElementById(`view-${t}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${t}`).classList.add('active-tab', 'text-white');
            if (t === 'treino') renderWorkout();
            if (t === 'dieta') renderDiet();
            if (t === 'progresso') renderProgress();
            save();
        }

        function switchDietMode(mode) {
            state.dietMode = mode;
            document.getElementById('diet-mode-treino').classList.toggle('bg-cyan-600', mode === 'treino');
            document.getElementById('diet-mode-treino').classList.toggle('text-white', mode === 'treino');
            document.getElementById('diet-mode-descanso').classList.toggle('bg-cyan-600', mode === 'descanso');
            document.getElementById('diet-mode-descanso').classList.toggle('text-white', mode === 'descanso');
            renderDiet();
            save();
        }

        function renderWorkout() {
            const current = workoutData.find(w => w.id === state.workoutId);
            document.getElementById('display-workout-name').textContent = current.name;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`day-${state.workoutId}`).classList.add('active');
            const list = document.getElementById('exercise-list');
            list.innerHTML = current.exercises.map((ex, exIdx) => `
                <div class="bg-gray-800 rounded-3xl p-5 border border-white/5 shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1 pr-2"><h4 class="font-bold text-white text-base leading-tight">${ex.n}</h4><p class="text-[10px] text-gray-500 uppercase mt-1 tracking-widest">${ex.s} séries • ${ex.r} reps</p>
                        ${ex.t ? `<p class="text-[9px] text-amber-400 font-bold uppercase mt-1 italic tracking-tight">★ ${ex.t}</p>` : ''}</div>
                        <img onclick="showFullImg('${ex.g}')" src="${ex.g}" class="w-14 h-14 rounded-xl object-cover bg-black/20 border border-white/10" onerror="this.src='https://placehold.co/100?text=GIF'">
                    </div>
                    <div class="space-y-2">
                        ${Array.from({length: ex.s}).map((_, sIdx) => {
                            const k = `${state.workoutId}_${exIdx}_${sIdx}`;
                            const l = state.logs[k] || { done: false, kg: '' };
                            return `
                                <div class="flex items-center gap-2">
                                    <div class="bg-gray-900 rounded-2xl flex-1 flex items-center px-4 py-2 border border-white/5">
                                        <span class="text-[9px] font-bold text-gray-600 mr-2 uppercase">SET ${sIdx+1}</span>
                                        <input type="number" onchange="updateKg('${k}', this.value)" value="${l.kg}" placeholder="0" class="bg-transparent w-full text-center text-sm font-bold text-cyan-400 outline-none">
                                        <span class="text-[9px] text-gray-700 ml-1">KG</span>
                                    </div>
                                    <button onclick="markSet('${k}', ${ex.d})" class="w-11 h-11 rounded-2xl flex items-center justify-center transition-all ${l.done ? 'bg-green-500 text-white shadow-lg' : 'bg-gray-700 text-gray-500'}">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('') + `<button onclick="alert('Boa sessão, Fábio!')" class="w-full bg-cyan-600 py-5 rounded-3xl font-bold text-xs tracking-[0.2em] shadow-xl active:scale-95 transition-all">CONCLUIR TREINO</button>`;
        }

        function renderDiet() {
            const data = nutritionData[state.dietMode];
            document.getElementById('diet-container').innerHTML = `
                <div class="bg-gray-800 p-5 rounded-3xl border border-white/5 text-center shadow-lg mb-6">
                    <h3 class="text-cyan-400 font-bold uppercase text-[10px] tracking-widest mb-4">Meta Alvo</h3>
                    <div class="grid grid-cols-4 gap-2 px-2">
                        <div><p class="text-lg font-bold">${data.kcal}</p><p class="text-[7px] text-gray-500 uppercase">Kcal</p></div>
                        <div><p class="text-lg font-bold">${data.p}g</p><p class="text-[7px] text-gray-500 uppercase">Prot</p></div>
                        <div><p class="text-lg font-bold">${data.c}g</p><p class="text-[7px] text-gray-500 uppercase">Carb</p></div>
                        <div><p class="text-lg font-bold">${data.g}g</p><p class="text-[7px] text-gray-500 uppercase">Gord</p></div>
                    </div>
                </div>
                <div class="space-y-3">
                    ${data.meals.map(m => `
                        <div class="bg-gray-800 p-4 rounded-2xl border border-white/5">
                            <div class="flex justify-between mb-1">
                                <h4 class="font-bold text-xs text-white">${m.n} <span class="text-gray-500 text-[10px] ml-1">(${m.t})</span></h4>
                                <span class="text-[9px] font-mono text-cyan-400 font-bold">${m.m}</span>
                            </div>
                            <p class="text-xs text-gray-400 leading-relaxed">${m.i}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderProgress() {
            const last = state.history[state.history.length - 1];
            document.getElementById('current-weight-card').textContent = `${last.w}kg`;
            document.getElementById('current-fat-card').textContent = `${last.f}%`;
        }

        function selectWorkout(id) { state.workoutId = id; document.getElementById('workout-dropdown').classList.remove('show'); renderWorkout(); save(); }
        function toggleWorkoutDropdown() { document.getElementById('workout-dropdown').classList.toggle('show'); document.getElementById('dropdown-icon').classList.toggle('rotate-180'); }
        function markSet(k, rest) { state.logs[k] = state.logs[k] || { done: false, kg: '' }; state.logs[k].done = !state.logs[k].done; if (state.logs[k].done) startTimer(rest); renderWorkout(); save(); }
        function updateKg(k, v) { if (!state.logs[k]) state.logs[k] = { done: false, kg: '' }; state.logs[k].kg = v; save(); }
        function startTimer(sec) { let left = sec; document.getElementById('timer-modal').classList.add('show'); clearInterval(timerInterval); timerInterval = setInterval(() => { left--; document.getElementById('timer-clock').textContent = `${Math.floor(left / 60)}:${(left % 60).toString().padStart(2, '0')}`; if (left <= 0) skipTimer(); }, 1000); }
        function skipTimer() { clearInterval(timerInterval); document.getElementById('timer-modal').classList.remove('show'); }
        function addProgressEntry() { const w = document.getElementById('input-weight').value; const f = document.getElementById('input-fat').value; if (w && f) { state.history.push({ d: new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}), w: parseFloat(w), f: parseFloat(f) }); document.getElementById('input-weight').value = ''; document.getElementById('input-fat').value = ''; save(); renderProgress(); alert("Progresso registrado!"); } }
        function showFullImg(src) { document.getElementById('full-img-src').src = src; document.getElementById('full-img-modal').classList.add('show'); }
    </script>
</body>
</html>
